services:
  postgres:
    image: postgres:16-alpine
    container_name: biznation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-biznation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-biznation_secret}
      POSTGRES_DB: ${DB_NAME:-biznation_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-biznation} -d ${DB_NAME:-biznation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - biznation-network

volumes:
  postgres_data:
    driver: local

networks:
  biznation-network:
    driver: bridge
